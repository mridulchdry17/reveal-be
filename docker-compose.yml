services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: reveal
      POSTGRES_PASSWORD: reveal
      POSTGRES_DB: reveal
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reveal"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
